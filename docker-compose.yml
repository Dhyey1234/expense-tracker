services:

  db:
    image: postgres:16-alpine
    container_name: postgres-db

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: expense_tracker

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d expense_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5


  auth-service:
    build: ./auth-service

    container_name: auth-service

    restart: unless-stopped

    env_file:
      - ./auth-service/.env

    ports:
      - "3001:3001"

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/"]
      interval: 10s
      timeout: 5s
      retries: 5


  expense-service:
    build: ./expense-service

    container_name: expense-service

    restart: unless-stopped

    env_file:
      - ./expense-service/.env

    ports:
      - "3002:3002"

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3002/"]
      interval: 10s
      timeout: 5s
      retries: 5


  report-service:
    build: ./report-service

    container_name: report-service

    restart: unless-stopped

    env_file:
      - ./report-service/.env

    environment:
      PORT: 3003
      EXPENSE_SERVICE: http://expense-service:3002

    ports:
      - "3003:3003"

    depends_on:
      expense-service:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3003/"]
      interval: 10s
      timeout: 5s
      retries: 5


  nginx:
    image: nginx:latest

    container_name: nginx-gateway

    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      auth-service:
        condition: service_healthy
      expense-service:
        condition: service_healthy
      report-service:
        condition: service_healthy


  frontend:
    build: ./frontend

    container_name: expense-frontend

    restart: unless-stopped

    ports:
      - "5173:80"

    depends_on:
      nginx:
        condition: service_started


volumes:
  postgres-data: