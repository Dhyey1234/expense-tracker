name: Expense Tracker CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      - name: Install Auth Service dependencies
        working-directory: ./auth-service
        run: npm ci


      - name: Run Auth Service tests
        working-directory: ./auth-service
        run: npm test


      - name: Install Expense Service dependencies
        working-directory: ./expense-service
        run: npm ci


      - name: Run Expense Service tests
        working-directory: ./expense-service
        run: npm test


  docker-build:

    runs-on: ubuntu-latest

    needs: test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Build Auth Service
        run: docker build ./auth-service


      - name: Build Expense Service
        run: docker build ./expense-service


      - name: Build Report Service
        run: docker build ./report-service


      - name: Build Frontend
        run: docker build ./frontend