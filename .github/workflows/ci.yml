on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      - name: Install Auth Service dependencies
        working-directory: ./auth-service
        run: npm ci


      - name: Run Auth Service tests
        working-directory: ./auth-service
        run: npm test


      - name: Install Expense Service dependencies
        working-directory: ./expense-service
        run: npm ci


      - name: Run Expense Service tests
        working-directory: ./expense-service
        run: npm test


  docker-build-and-push:

    runs-on: ubuntu-latest

    needs: test

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Build and push Auth Service
        uses: docker/build-push-action@v6
        with:
          context: ./auth-service
          push: true
          tags: ghcr.io/dhyey1234/expense-tracker-auth:latest


      - name: Build and push Expense Service
        uses: docker/build-push-action@v6
        with:
          context: ./expense-service
          push: true
          tags: ghcr.io/dhyey1234/expense-tracker-expense:latest


      - name: Build and push Report Service
        uses: docker/build-push-action@v6
        with:
          context: ./report-service
          push: true
          tags: ghcr.io/dhyey1234/expense-tracker-report:latest


      - name: Build and push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/dhyey1234/expense-tracker-frontend:latest